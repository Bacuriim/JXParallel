name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Supported range: x86 from Java 8 to 17 (newest Windows x86 JDK published by Temurin/Zulu),
        # x64 from Java 8 to the latest release.
        include:
          - os: ubuntu-latest
            java: 8
            arch: x64
            command: mvn --batch-mode --no-transfer-progress -pl jxparallel-core -am test
          - os: ubuntu-latest
            java: 11
            arch: x64
            command: mvn --batch-mode --no-transfer-progress test
          - os: ubuntu-latest
            java: 17
            arch: x64
            command: mvn --batch-mode --no-transfer-progress test
          - os: ubuntu-latest
            java: 21
            arch: x64
            command: mvn --batch-mode --no-transfer-progress test
          - os: windows-latest
            java: 17
            arch: x64
            command: mvn --batch-mode --no-transfer-progress test
          # Mockito 5 needs Java 11, so Java 8 builds only the runtime modules.
          - os: windows-latest
            java: 8
            arch: x86
            command: mvn --batch-mode --no-transfer-progress -pl jxparallel-core,jxparallel-ui -am test
          # Newest Windows x86 JDK that Temurin and Zulu publish is 17 (the port was deprecated in 21).
          - os: windows-latest
            java: 17
            arch: x86
            command: mvn --batch-mode --no-transfer-progress test
          - os: windows-latest
            java: 25
            arch: x64
            command: mvn --batch-mode --no-transfer-progress test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.arch }}
          cache: maven
      - name: Test
        run: ${{ matrix.command }}

  # FXML and JavaFX bridge modules, including the FxmlTemplate vs FXMLLoader differential test.
  legacy-javafx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Test
        run: mvn --batch-mode --no-transfer-progress -Plegacy-javafx test

  # OpenJDK jcstress: thread-safety contracts of jxparallel-core. jcstress 0.16 needs JDK 9+ to run.
  jcstress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build
        run: mvn --batch-mode --no-transfer-progress -Pjcstress -pl jxparallel-jcstress -am package -DskipTests
      - name: Run
        run: |
          java -jar jxparallel-jcstress/target/jcstress.jar -m quick | tee jcstress.log
          grep -q "Failed tests: No matches" jcstress.log
          grep -q "Error tests: No matches" jcstress.log

  # JMH regression gate on ratios between benchmarks of the same run (see scripts/check-jmh.py).
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build
        run: mvn --batch-mode --no-transfer-progress -pl jxparallel-benchmarks -am compile dependency:build-classpath -Dmdep.outputFile=cp.txt
      - name: Run
        run: |
          java -cp "jxparallel-benchmarks/target/classes:$(cat jxparallel-benchmarks/cp.txt)" org.openjdk.jmh.Main 'ReconcileBenchmark|ObservableBenchmark' -f 1 -wi 3 -i 5 -w 1s -r 1s -rf json -rff jmh.json
          python3 scripts/check-jmh.py jmh.json
