name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Supported range: x86 from Java 8 to 17 (newest Windows x86 JDK published by Temurin/Zulu),
        # x64 from Java 8 to the latest release.
        include:
          - os: ubuntu-latest
            java: 8
            arch: x64
            command: mvn --batch-mode --no-transfer-progress -pl jxparallel-core -am test
          - os: ubuntu-latest
            java: 11
            arch: x64
            command: mvn --batch-mode --no-transfer-progress test
          - os: ubuntu-latest
            java: 17
            arch: x64
            command: mvn --batch-mode --no-transfer-progress test
          - os: ubuntu-latest
            java: 21
            arch: x64
            command: mvn --batch-mode --no-transfer-progress test
          - os: windows-latest
            java: 17
            arch: x64
            command: mvn --batch-mode --no-transfer-progress test
          # Mockito 5 needs Java 11, so Java 8 builds only the runtime modules.
          - os: windows-latest
            java: 8
            arch: x86
            command: mvn --batch-mode --no-transfer-progress -pl jxparallel-core,jxparallel-ui -am test
          # Newest Windows x86 JDK that Temurin and Zulu publish is 17 (the port was deprecated in 21).
          - os: windows-latest
            java: 17
            arch: x86
            command: mvn --batch-mode --no-transfer-progress test
          - os: windows-latest
            java: 25
            arch: x64
            command: mvn --batch-mode --no-transfer-progress test
          # macOS and ARM64: profiles natives-macos-x64, natives-macos-arm64, natives-linux-arm64 and
          # natives-windows-arm64 of jxparallel-ui. First configured without any run: if one of these
          # fails, that platform is not supported yet (docs/compatibility.md). No JVM flag is needed:
          # the tests that need an OpenGL window skip when no window can be made (on macOS the display
          # loop needs -XstartOnFirstThread, which a test run does not have).
          # macos-latest is Apple Silicon; macos-15-intel is the x64 runner (macos-13 has been retired).
          - os: macos-latest
            java: 17
            arch: aarch64
            command: mvn --batch-mode --no-transfer-progress test
          - os: macos-latest
            java: 21
            arch: aarch64
            command: mvn --batch-mode --no-transfer-progress test
          - os: macos-15-intel
            java: 17
            arch: x64
            command: mvn --batch-mode --no-transfer-progress test
          # Free for public repositories only; remove these two if the repository is private.
          - os: ubuntu-24.04-arm
            java: 17
            arch: aarch64
            command: mvn --batch-mode --no-transfer-progress test
          - os: windows-11-arm
            java: 17
            arch: aarch64
            command: mvn --batch-mode --no-transfer-progress test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.arch }}
          cache: maven
      # Skija's libskija.so links libEGL, which the runner image does not ship.
      - name: Install Skija dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1
      - name: Test
        run: ${{ matrix.command }}

  # FXML and JavaFX bridge modules, including the FxmlTemplate vs FXMLLoader differential test.
  legacy-javafx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Test
        run: mvn --batch-mode --no-transfer-progress -Plegacy-javafx test

  # JavaFX-compatible API: built on JavaFX 8 internals, so only on a JDK 8 that bundles JavaFX
  # (jre/lib/ext/jfxrt.jar activates the javafx8 profile).
  javafx8:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-package: jdk+fx
          java-version: 8
          cache: maven
      - name: Test
        run: mvn --batch-mode --no-transfer-progress -pl jxparallel-fx,jxparallel-fx-controlsfx -am test

  # JXForge Gradle plugin: its own Gradle build (committed wrapper), TestKit builds of small sample projects.
  # The sample projects compile against the jars of jxparallel-forge and jxparallel-core built by Maven.
  gradle-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build forge
        run: mvn --batch-mode --no-transfer-progress -pl jxparallel-forge -am package -DskipTests
      - name: Test the plugin
        working-directory: jxforge-gradle-plugin
        run: ./gradlew --no-daemon --console=plain test

  # JXForge IntelliJ IDEA plugin: its own Gradle build (committed wrapper); platform tests run headless on the IntelliJ 2024.2 platform.
  # The forge (JDK 17) is built by Maven first, because the build runs com.jxparallel.forge.JxmlXsd to bundle jxml.xsd; Gradle runs on JDK 21.
  intellij-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build forge
        run: mvn --batch-mode --no-transfer-progress -pl jxparallel-forge -am package -DskipTests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test the plugin
        working-directory: jxforge-intellij-plugin
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon --console=plain test buildPlugin

  # OpenJDK jcstress: thread-safety contracts of jxparallel-core. jcstress 0.16 needs JDK 9+ to run.
  jcstress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build
        run: mvn --batch-mode --no-transfer-progress -Pjcstress -pl jxparallel-jcstress -am package -DskipTests
      - name: Run
        run: |
          java -jar jxparallel-jcstress/target/jcstress.jar -m quick | tee jcstress.log
          grep -q "Failed tests: No matches" jcstress.log
          grep -q "Error tests: No matches" jcstress.log

  # JMH regression gate on ratios between benchmarks of the same run (see scripts/check-jmh.py).
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build
        run: mvn --batch-mode --no-transfer-progress -pl jxparallel-benchmarks -am compile dependency:build-classpath -Dmdep.outputFile=cp.txt
      - name: Run
        run: |
          java -cp "jxparallel-benchmarks/target/classes:$(cat jxparallel-benchmarks/cp.txt)" org.openjdk.jmh.Main 'ReconcileBenchmark|ObservableBenchmark' -f 1 -wi 3 -i 5 -w 1s -r 1s -rf json -rff jmh.json
          python3 scripts/check-jmh.py jmh.json
