name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            java: 8
            command: mvn --batch-mode --no-transfer-progress -pl jxparallel-core -am test
          - os: ubuntu-latest
            java: 11
            command: mvn --batch-mode --no-transfer-progress test
          - os: ubuntu-latest
            java: 17
            command: mvn --batch-mode --no-transfer-progress test
          - os: ubuntu-latest
            java: 21
            command: mvn --batch-mode --no-transfer-progress test
          - os: windows-latest
            java: 17
            command: mvn --batch-mode --no-transfer-progress test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test
        run: ${{ matrix.command }}
