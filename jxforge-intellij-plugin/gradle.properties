# The plugin compiles and its tests run on a JDK 21 toolchain (build.gradle.kts); Gradle finds it among the installed JDKs
# (JAVA_HOME, the usual install folders, ~/.jdks). Gradle itself can run on JDK 17 or newer.
org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.configuration-cache=false
pluginVersion=0.1.0
