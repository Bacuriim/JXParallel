<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 544" width="900" height="544" role="img" class="viz" aria-labelledby="t d"><title id="t">Compiled JXML against JavaFX on Java 17</title><desc id="d">For each metric, how many times better compiled JXML is than the JavaFX control, as a geometric mean over the components that have a JavaFX equivalent. Build, cold 24x; Build, warm 22x; Ready to paint, cold 5.0x; Ready to paint, warm 87x; Update one prop, warm 5.1x; Paint, warm (indicative) 12x; Memory allocated: build 31x; Memory allocated: ready 105x; Memory allocated: update 4.1x; Memory retained per instance 51x; Classes loaded 2.1x; Process CPU, whole run 8.1x</desc><style>
