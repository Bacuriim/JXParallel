<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 544" width="900" height="544" role="img" class="viz" aria-labelledby="t d"><title id="t">Compiled JXML against JavaFX on Java 17</title><desc id="d">For each metric, how many times better compiled JXML is than the JavaFX control, as a geometric mean over the components that have a JavaFX equivalent. Build, cold 20x; Build, warm 17x; Ready to paint, cold 4.9x; Ready to paint, warm 80x; Update one prop, warm 4.4x; Paint, warm (indicative) 3.4x; Memory allocated: build 15x; Memory allocated: ready 78x; Memory allocated: update 1.8x; Memory retained per instance 39x; Classes loaded 2.1x; Process CPU, whole run 7.3x</desc><style>
