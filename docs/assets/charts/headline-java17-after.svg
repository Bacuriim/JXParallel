<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 544" width="900" height="544" role="img" class="viz" aria-labelledby="t d"><title id="t">Compiled JXML against JavaFX on Java 17</title><desc id="d">For each metric, how many times better compiled JXML is than the JavaFX control, as a geometric mean over the components that have a JavaFX equivalent. Build, cold 20x; Build, warm 19x; Ready to paint, cold 5.0x; Ready to paint, warm 86x; Update one prop, warm 4.9x; Paint, warm (indicative) 7.4x; Memory allocated: build 20x; Memory allocated: ready 107x; Memory allocated: update 2.7x; Memory retained per instance 47x; Classes loaded 2.1x; Process CPU, whole run 7.9x</desc><style>
